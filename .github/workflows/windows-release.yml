name: Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Package Windows executable
        run: npm run build:win

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $folder = "packages/StremioDownloader-win32-x64"
          $exe = Join-Path $folder 'StremioDownloader.exe'
          if (-not (Test-Path $exe)) { throw "Windows executable not found: $exe" }
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "$folder/*" -DestinationPath "release/StremioDownloader-$version-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StremioDownloader-${{ steps.version.outputs.version }}-windows-x64
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Stremio Downloader v${{ steps.version.outputs.version }}
          files: release/*.zip
          generate_release_notes: true
          body: |
            Portable Windows x64 build of Stremio Downloader v${{ steps.version.outputs.version }}.

            Download and extract the ZIP, then run `StremioDownloader.exe`.
            Keep all files in the extracted folder together.
            FFprobe is optional and must be installed separately for audio language,
            subtitle, and codec detection. See README.md for instructions.

            This is a community-maintained fork and has not been code-signed.
